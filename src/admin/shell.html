<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="shopify-api-key" content="%%SHOPIFY_API_KEY%%" />
  <title>Orbi</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <link rel="stylesheet" href="/admin/app.css" />
  <script src="/admin/vendor/lucide.min.js"></script>
</head>
<body class="antialiased selection:bg-indigo-500/20">
  <!-- Viewport Frame Container -->
  <div id="viewport-wrapper" class="mx-auto transition-all duration-200 w-full">
    <div class="min-h-screen flex flex-col md:flex-row bg-canvas text-ink-primary relative">

      <!-- Left Sidebar (Desktop/Tablet) -->
      <aside id="app-sidebar" class="w-60 shrink-0 border-r border-line-subtle bg-surface hidden md:flex flex-col justify-between md:sticky md:top-0 md:h-screen md:self-start md:overflow-y-auto transition-all duration-150 select-none">
        <div>
          <!-- Brand Header -->
          <div class="h-14 px-3 flex items-center justify-between border-b border-line-subtle">
            <div class="flex items-center gap-2 min-w-0">
              <div class="w-8 h-8 rounded-sm bg-accent-gradient flex items-center justify-center text-white font-bold shadow-xs shrink-0">
                <i data-lucide="sparkles" class="w-4 h-4"></i>
              </div>
              <div class="sidebar-label truncate">
                <div class="text-sm font-semibold tracking-tight leading-none">Orbi AI</div>
                <div class="text-[11px] text-ink-muted mt-0.5">Shopping Assistant</div>
              </div>
            </div>
            <button type="button" id="collapse-sidebar-btn" class="p-1.5 rounded-sm text-ink-muted hover:text-ink-primary hover:bg-subtle focus-ring" title="Collapse sidebar ( [ )" aria-label="Collapse sidebar">
              <i data-lucide="panel-left-close" class="w-4 h-4"></i>
            </button>
          </div>

          <!-- Primary Navigation -->
          <nav class="p-2 space-y-0.5" id="sidebar-nav" aria-label="Main Navigation"></nav>
        </div>

        <!-- Bottom Store & Plan Card -->
        <div class="p-2.5 border-t border-line-subtle bg-subtle/50">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-indigo-500/15 text-accent font-semibold text-xs flex items-center justify-center shrink-0 tabular-nums">
              <span id="store-initials">··</span>
            </div>
            <div class="sidebar-label min-w-0 flex-1">
              <div class="text-xs font-semibold truncate text-ink-primary"><span id="store-name">Loading…</span></div>
              <div class="flex items-center gap-1.5 mt-0.5">
                <span id="store-domain" class="px-1.5 py-0.5 text-[10px] font-medium rounded-pill bg-accent-soft text-accent-text truncate max-w-[110px]"></span>
                <button type="button" id="open-help-modal-btn" class="text-[11px] text-ink-secondary hover:text-accent underline">Help</button>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Column -->
      <div class="flex-1 flex flex-col min-w-0 pb-16 md:pb-0">
        <!-- Top Bar -->
        <header class="h-14 px-4 border-b border-line-subtle bg-surface/90 backdrop-blur sticky top-0 z-20 flex items-center justify-between gap-3">
          <!-- Global Command Palette Search Trigger -->
          <div class="flex items-center gap-2 flex-1 min-w-0 max-w-md">
            <button type="button" id="open-cmd-palette-btn" class="w-full flex items-center justify-between px-3 py-1.5 text-xs text-ink-muted bg-subtle hover:bg-subtle/80 border border-line-subtle rounded-md transition-colors focus-ring">
              <span class="flex items-center gap-2 truncate">
                <i data-lucide="search" class="w-3.5 h-3.5 text-ink-secondary shrink-0"></i>
                <span class="truncate">Search chats and shoppers...</span>
              </span>
              <kbd class="hidden sm:inline px-1.5 py-0.5 text-[10px] font-mono bg-surface border border-line-subtle rounded text-ink-secondary shrink-0">⌘K</kbd>
            </button>
          </div>

          <!-- Right Controls: Period Selector, Notifications, Dark Mode -->
          <div class="flex items-center gap-2 shrink-0">
            <select id="period-select" aria-label="Period" class="sm:hidden px-2 py-1.5 text-xs rounded-md border border-line-subtle bg-surface"><option value="today">Today</option><option value="last7">7 days</option><option value="last30">30 days</option></select>
            <div class="hidden sm:flex items-center bg-subtle p-0.5 rounded-md border border-line-subtle" role="group" aria-label="Period selector">
              <button type="button" data-period="today" class="period-btn px-2.5 py-1 rounded-sm text-xs font-medium bg-surface text-ink-primary shadow-xs">Today</button>
              <button type="button" data-period="last7" class="period-btn px-2.5 py-1 rounded-sm text-xs font-medium text-ink-secondary hover:text-ink-primary">7d</button>
              <button type="button" data-period="last30" class="period-btn px-2.5 py-1 rounded-sm text-xs font-medium text-ink-secondary hover:text-ink-primary">30d</button>
              <button type="button" data-period="custom" class="period-btn px-2.5 py-1 rounded-sm text-xs font-medium text-ink-secondary hover:text-ink-primary flex items-center gap-1">
                <i data-lucide="calendar" class="w-3 h-3"></i>
                <span id="custom-date-label">Custom</span>
              </button>
            </div>

            <!-- Live help: am I free to take a call -->
            <div id="support-presence" hidden></div>

            <!-- Notifications Bell -->
            <div class="relative">
              <button type="button" id="toggle-notif-btn" class="p-2 rounded-md border border-line-subtle bg-surface hover:bg-subtle text-ink-secondary hover:text-ink-primary relative focus-ring" aria-label="Notifications">
                <i data-lucide="bell" class="w-4 h-4"></i>
                <span id="notif-dot" class="w-2 h-2 rounded-full bg-danger absolute top-1.5 right-1.5"></span>
              </button>
              <!-- Notification Popover -->
              <div id="notif-popover" class="hidden absolute right-0 mt-2 w-80 rounded-lg bg-surface border border-line-subtle shadow-lg p-3 z-50">
                <div class="flex items-center justify-between pb-2 mb-2 border-b border-line-subtle">
                  <span class="text-xs font-semibold">Live Store Alerts</span>
                  <button type="button" id="mark-notif-read-btn" class="text-[11px] text-accent hover:underline">Mark all read</button>
                </div>
                <div class="space-y-2 text-xs" id="notif-list"></div>
              </div>
            </div>

            <!-- Dark Mode Toggle -->
            <button type="button" id="toggle-theme-btn" class="p-2 rounded-md border border-line-subtle bg-surface hover:bg-subtle text-ink-secondary hover:text-ink-primary focus-ring" aria-label="Toggle color theme">
              <i data-lucide="moon" class="w-4 h-4" id="theme-icon"></i>
            </button>
          </div>
        </header>

        <!-- Dynamic Screen Mount -->
        <main id="screen-container" class="flex-1 p-4 md:p-6 max-w-[1440px] w-full mx-auto"></main>
      </div>

      <!-- Mobile Bottom Tab Bar (5 Main Items + More Sheet) -->
      <nav id="mobile-tab-bar" class="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-surface/95 backdrop-blur border-t border-line-subtle flex items-center justify-around z-30 px-1" aria-label="Mobile Navigation"></nav>
    </div>
  </div>

  <!-- Right Side Drawer (Order Details / Customer Timeline + Delete Personal Data / Version History Diff) -->
  <div id="drawer-backdrop" class="hidden fixed inset-0 bg-slate-950/50 backdrop-blur-xs z-40 transition-opacity"></div>
  <aside id="side-drawer" class="hidden fixed top-0 right-0 bottom-0 w-full max-w-lg bg-surface border-l border-line-subtle shadow-lg z-50 flex flex-col">
    <div class="p-4 border-b border-line-subtle flex items-center justify-between">
      <div id="drawer-title" class="type-h2">Details</div>
      <button type="button" id="close-drawer-btn" class="p-1.5 rounded-sm text-ink-muted hover:text-ink-primary hover:bg-subtle focus-ring" aria-label="Close drawer">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
    <div id="drawer-body" class="flex-1 overflow-y-auto p-4"></div>
    <div id="drawer-footer" class="p-4 border-t border-line-subtle bg-subtle/40 flex items-center justify-end gap-2"></div>
  </aside>

  <!-- Modal Dialog (Flag AI Reply / Delete Personal Data Confirmation / Add Q&A / Custom Date Picker) -->
  <div id="modal-backdrop" class="hidden fixed inset-0 bg-slate-950/55 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div id="modal-card" class="w-full max-w-md rounded-lg bg-surface border border-line-subtle shadow-lg overflow-hidden" role="dialog" aria-modal="true">
      <div class="p-4 border-b border-line-subtle flex items-center justify-between">
        <h3 id="modal-title" class="type-h2">Modal</h3>
        <button type="button" id="close-modal-btn" class="p-1 rounded-sm text-ink-muted hover:text-ink-primary hover:bg-subtle" aria-label="Close modal">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="modal-body" class="p-4"></div>
      <div id="modal-footer" class="px-4 py-3 border-t border-line-subtle bg-subtle/40 flex items-center justify-end gap-2"></div>
    </div>
  </div>

  <!-- Command Palette (Cmd/Ctrl + K) -->
  <div id="cmd-palette-backdrop" class="hidden fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 flex items-start justify-center pt-20 p-4">
    <div class="w-full max-w-xl rounded-lg bg-surface border border-line-subtle shadow-lg overflow-hidden" role="dialog" aria-label="Command Palette">
      <div class="p-3 border-b border-line-subtle flex items-center gap-2">
        <i data-lucide="search" class="w-4 h-4 text-accent"></i>
        <input id="cmd-palette-input" type="text" placeholder="Type a shopper name, email or screen..." class="w-full bg-transparent text-sm text-ink-primary focus:outline-none" autocomplete="off" />
        <button type="button" id="close-cmd-palette-btn" class="px-1.5 py-0.5 text-[11px] font-mono bg-subtle rounded text-ink-muted hover:text-ink-primary">ESC</button>
      </div>
      <div id="cmd-palette-results" class="max-h-80 overflow-y-auto p-2 space-y-1"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-16 right-5 z-[60] flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <!-- A shopper's call coming in, and the call in progress (live help) -->
  <div id="support-incoming" hidden class="fixed top-20 left-1/2 -translate-x-1/2 z-[55] flex flex-col gap-3 items-center"></div>
  <aside id="support-dock" hidden aria-label="Call in progress" class="fixed bottom-4 right-4 z-[55] w-[380px] max-w-[calc(100vw-2rem)] rounded-lg bg-surface border border-line-strong shadow-lg overflow-hidden"></aside>

  <script type="module" src="/admin/app.js"></script>
</body>
</html>
