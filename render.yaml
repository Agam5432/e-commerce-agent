# Render Blueprint for the Orbi backend (chat, voice, admin dashboard, Shopify webhooks).
# Render -> New -> Blueprint -> pick this repository. Render reads this file and creates the web service.
# Secrets are added in the Render dashboard after the first deploy (see the note at the bottom).
# Never put a secret value in this file: it is in git.
services:
  - type: web
    name: techstore-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free plan: sleeps after 15 idle minutes, next shopper waits about a minute. Change to starter to keep it always on.
    plan: free
    # closest Render region to India
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # ---- fixed values (not secret) ----
      - key: NODE_ENV
        value: production
      # Shopify's App Proxy + Render's load balancer
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: DB_NAME
        value: mini-agent
      - key: SHOPIFY_API_VERSION
        value: "2026-10"
      - key: SHOPIFY_SCOPES
        value: read_products,read_inventory,read_locations,read_customers,write_customers,read_orders,write_orders,read_draft_orders,write_draft_orders,read_discounts,read_legal_policies
      - key: LLM_PRIMARY
        value: gemini
      - key: LLM_SECONDARY
        value: claude

      # ---- the address of this service ----
      - key: APP_URL
        value: https://techstore-agent.onrender.com
      - key: SHOPIFY_OAUTH_REDIRECT_URI
        value: https://techstore-agent.onrender.com/api/shopify/oauth/callback

      # Secrets are NOT in this file (it is in git). After the first deploy, open this service ->
      # Environment -> "Add from .env" and paste your secrets once: MONGODB_URI, SHOPIFY_CLIENT_ID,
      # SHOPIFY_CLIENT_SECRET, SHOPIFY_TOKEN_ENCRYPTION_KEY, OTP_HMAC_SECRET, ANALYTICS_HMAC_SECRET,
      # GEMINI_API_KEY, ANTHROPIC_API_KEY (optional), EMAIL_USER, EMAIL_APP_PASSWORD.
      # Keep the SAME values as your local .env, or saved Shopify tokens and codes stop working.
