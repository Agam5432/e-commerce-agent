# Render Blueprint for the Orbi backend (chat, voice, admin dashboard, Shopify webhooks).
# Render -> New -> Blueprint -> pick this repository. Render reads this file and creates the web service.
# Values marked "sync: false" are secrets: Render asks for them once on the screen (copy them from your .env).
# Never put a secret value in this file: it is in git.
services:
  - type: web
    name: techstore-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free plan: sleeps after 15 idle minutes, next shopper waits about a minute. Change to starter to keep it always on.
    plan: free
    # closest Render region to India
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # ---- fixed values (not secret) ----
      - key: NODE_ENV
        value: production
      # Shopify's App Proxy + Render's load balancer
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: DB_NAME
        value: mini-agent
      - key: SHOPIFY_API_VERSION
        value: "2026-10"
      - key: SHOPIFY_SCOPES
        value: read_products,read_inventory,read_locations,read_customers,write_customers,read_orders,write_orders,read_draft_orders,write_draft_orders,read_discounts,read_legal_policies
      - key: LLM_PRIMARY
        value: gemini
      - key: LLM_SECONDARY
        value: claude

      # ---- the address of this service: https://<service-name>.onrender.com (fill in once Render shows it) ----
      - key: APP_URL
        sync: false
      - key: SHOPIFY_OAUTH_REDIRECT_URI
        sync: false

      # ---- secrets: copy each from your .env (keep the SAME values, or saved Shopify tokens and codes stop working) ----
      - key: MONGODB_URI
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: OTP_HMAC_SECRET
        sync: false
      - key: ANALYTICS_HMAC_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # optional: the Claude backup when Gemini is slow or down (leave empty if you have no key)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
